name: Suggest a feature
description: Share an idea for the Pokémon TCG Pocket tracker.
title: "Feature: "
labels: ["feedback"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you like the site to do? Describe the feature and the behaviour you have in mind.
      placeholder: Add a way to...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Optional. Anything else that would help, such as the set, the card, or the screen you were using.
    validations:
      required: false
